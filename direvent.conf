debug 0;
foreground true;
    
watcher {
    path .;
    event (create, write, delete);
    file (
      "/.*\\.scm/i",
      "/.*\\.js/i",
      "/.*\\.conf/i",
    );
    option (stdout, stderr, shell, wait);
    max-instances 1;
    command "maak test-build-and-serve";
    timeout 15;    
}

watcher {
    path ./src/hygguile;
    event (create, write, delete);
    file (
      "/.*\\.scm/i"
    );
    option (stdout, stderr, shell, wait);
    max-instances 1;
    command "cd ../../ && maak test-build-and-serve";
    timeout 15;
}

watcher {
    path ./src/hygguile/components;
    event (create, write, delete);
    file (
      "/.*\\.scm/i"
    );
    option (stdout, stderr, shell, wait);
    max-instances 1;
    command "cd ../../../ && maak test-build-and-serve";
    timeout 15;
}

watcher {
    path ./resources/js;
    event (create, write, delete);
    file (
      "/.*\\.js/i"
    );
    option (stdout, stderr, shell, wait);
    max-instances 1;
    command "cd ../../ && maak test-build-and-serve";
    timeout 15;
}
