debug 0;
foreground true;
    
watcher {
    path .;
    event (create, write, delete);
    file (
        "**/*.js",
        "**/**/*.js",
        "*.scm",
        "**/*.scm",
        "**/**/*.scm"
    );
    option (stdout, stderr, shell, wait);
    max-instances 1;
    command "maak dev";
   
}

