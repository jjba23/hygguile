debug 0;
foreground true;
    
watcher {
    path .;
    event (create, write, delete);
    file (
      "/.*\\.scm/i",
      "/.*\\.js/i",
      "/.*\\.conf/i",
    );
    option (stdout, stderr, shell, wait);
    max-instances 1;
    command "maak build-and-serve";
}

watcher {
    path ./src/hygguile;
    event (create, write, delete);
    file (
      "/.*\\.scm/i"
    );
    option (stdout, stderr, shell, wait);
    max-instances 1;
    command "cd ../../ && maak build-and-serve";
}
